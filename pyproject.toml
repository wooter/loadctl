[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loadctl"
version = "0.1.0"
description = "Phase-aware energy management system for home load orchestration"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
loadctl = "loadctl.__main__:main"
